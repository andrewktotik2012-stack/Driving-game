<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Driving — МКПП</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
#app{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.gauge{position:absolute;bottom:8px;width:110px;height:110px;pointer-events:none}
#speedo{left:8px}
#tacho{right:8px}
#gearBox{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);pointer-events:auto;
  background:rgba(0,0,0,.5);border-radius:8px;padding:6px 12px;color:#fff;text-align:center}
#gearBox .lbl{font-size:10px;color:#aaa}
#gearBox .val{font-size:28px;font-weight:bold;color:#4f4}
#gearBox .stall{font-size:11px;color:#f55;margin-top:2px;height:12px}
#pedals{position:fixed;bottom:120px;right:8px;z-index:11;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.pedal{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.pedal.active{background:rgba(255,80,80,.6);border-color:#f66}
#clutch{background:rgba(80,80,200,.3)}
#clutch.active{background:rgba(100,100,255,.7)}
#gearLever{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:4px;pointer-events:auto;padding:6px;background:rgba(0,0,0,.4);border-radius:10px}
.gBtn{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.gBtn.active{background:rgba(80,200,80,.7);border-color:#5f5}
#steer{position:fixed;bottom:8px;left:8px;width:140px;height:140px;z-index:11;pointer-events:auto;touch-action:none}
#soundBtn{position:fixed;top:8px;right:8px;z-index:12;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid #fff;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#speedVal,#rpmVal{position:absolute;bottom:25px;width:100%;text-align:center;color:#fff;font-size:11px;font-weight:bold;text-shadow:0 0 3px #000}
#speedVal{left:0}
#rpmVal{right:0}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.7);padding:14px 22px;border-radius:10px;font-size:14px;z-index:15;display:none;text-align:center}
#msg.on{display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <canvas id="speedo" class="gauge" width="220" height="220"></canvas>
  <canvas id="tacho" class="gauge" width="220" height="220"></canvas>
  <div id="gearBox">
    <div class="lbl">ПЕРЕДАЧА</div>
    <div class="val" id="gearVal">N</div>
    <div class="stall" id="stallMsg"></div>
  </div>
</div>
<div id="pedals">
  <div class="pedal" id="gasPed">ГАЗ</div>
  <div class="pedal" id="brakePed">ТОРМОЗ</div>
  <div class="pedal" id="clutch">СЦЕП</div>
</div>
<div id="gearLever">
  <div class="gBtn" data-g="1">1</div>
  <div class="gBtn" data-g="2">2</div>
  <div class="gBtn" data-g="3">3</div>
  <div class="gBtn" data-g="4">4</div>
  <div class="gBtn" data-g="5">5</div>
  <div class="gBtn" data-g="R">R</div>
  <div class="gBtn active" data-g="N">N</div>
</div>
<canvas id="steer"></canvas>
<div id="soundBtn">🔊</div>
<div id="msg"></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ============ SCENE ============
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,80,300);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(80,150,60);
scene.add(sun);

// земля
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({color:0x3a5a3a}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// дорожная сетка
const roadMat=new THREE.MeshLambertMaterial({color:0x1a1a1a});
const roads=[];
for(let i=-3;i<=3;i++){
  const h=new THREE.Mesh(new THREE.PlaneGeometry(600,10),roadMat);
  h.rotation.x=-Math.PI/2;h.position.set(0,.01,i*50);scene.add(h);roads.push(h);
  const v=new THREE.Mesh(new THREE.PlaneGeometry(10,600),roadMat);
  v.rotation.x=-Math.PI/2;v.position.set(i*50,.01,0);scene.add(v);roads.push(v);
}

// разметка
const lineMat=new THREE.MeshBasicMaterial({color:0xffff00});
for(let i=-3;i<=3;i++){
  for(let j=-300;j<=300;j+=8){
    const hl=new THREE.Mesh(new THREE.PlaneGeometry(4,.4),lineMat);
    hl.rotation.x=-Math.PI/2;hl.position.set(j,.02,i*50);scene.add(hl);
  }
}
// разметка по вертикали
for(let i=-3;i<=3;i++){
  for(let j=-300;j<=300;j+=8){
    const vl=new THREE.Mesh(new THREE.PlaneGeometry(.4,4),lineMat);
    vl.rotation.x=-Math.PI/2;vl.position.set(i*50,.02,j);scene.add(vl);
  }
}

// здания
const buildings=[];
const bColors=[0x8899aa,0xaa9988,0x99aabb,0xbbaa99,0xa0a0a0];
function mkBuilding(x,z,w,d,f){
  const g=new THREE.Group();g.position.set(x,0,z);
  const col=bColors[Math.floor(Math.random()*5)];
  const mat=new THREE.MeshLambertMaterial({color:col});
  const h=f*4;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  b.position.y=h/2;g.add(b);
  // окна
  const windowMat=new THREE.MeshBasicMaterial({color:0xffdd88});
  for(let i=0;i<f;i++){
    for(let k=0;k<3;k++){
      if(Math.random()>0.6)continue;
      const ww=new THREE.Mesh(new THREE.PlaneGeometry(1,1),windowMat);
      ww.position.set((k-1)*w/3.5,i*4+2.5,d/2+.01);
      g.add(ww);
    }
  }
  scene.add(g);buildings.push(g);
}
for(let gx=-3;gx<=3;gx++)for(let gz=-3;gz<=3;gz++){
  if(!gx&&!gz)continue;
  const cx=gx*50,cz=gz*50;
  for(let i=0;i<3;i++){
    const bx=cx+(Math.random()-.5)*30;
    const bz=cz+(Math.random()-.5)*30;
    if(Math.abs(bx-cx)<15&&Math.abs(bz-cz)<15)continue;
    mkBuilding(bx,bz,8+Math.random()*4,8+Math.random()*4,3+Math.floor(Math.random()*7));
  }
}

// фонари
const poleMat=new THREE.MeshLambertMaterial({color:0x333333});
const poleGeo=new THREE.CylinderGeometry(.2,.2,8,6);
const lampMat=new THREE.MeshBasicMaterial({color:0xffdd55});
const headGeo=new THREE.SphereGeometry(.5,6,6);
for(let i=-3;i<=3;i++){
  for(let j=-300;j<=300;j+=30){
    const p=new THREE.Mesh(poleGeo,poleMat);
    p.position.set(i*50+7,4,j);scene.add(p);
    const h=new THREE.Mesh(headGeo,lampMat);
    h.position.set(i*50+7,8.3,j);scene.add(h);
  }
}
// ============ МАШИНА ============
const car={};
car.group=new THREE.Group();

// кузов
const carBody=new THREE.Mesh(new THREE.BoxGeometry(1.8,.7,4),
  new THREE.MeshLambertMaterial({color:0xcc3333}));
carBody.position.y=.6;car.group.add(carBody);

// капот
const hood=new THREE.Mesh(new THREE.BoxGeometry(1.8,.4,1),
  new THREE.MeshLambertMaterial({color:0xaa2222}));
hood.position.set(0,.9,1.5);car.group.add(hood);

// крыша
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.6,.6,2),
  new THREE.MeshLambertMaterial({color:0xdd4444}));
roof.position.set(0,1.4,-.3);car.group.add(roof);

// стёкла
const glassMat=new THREE.MeshLambertMaterial({color:0x223344,transparent:true,opacity:.7});
const wind=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,.1),glassMat);
wind.position.set(0,1.4,.7);car.group.add(wind);
const rear=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,.1),glassMat);
rear.position.set(0,1.4,-1.3);car.group.add(rear);

// колёса
const wheelGeo=new THREE.CylinderGeometry(.4,.4,.25,12);
const wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
car.wheels=[];
for(const wx of[-.95,.95])for(const wz of[1.3,-1.3]){
  const w=new THREE.Mesh(wheelGeo,wheelMat);
  w.rotation.z=Math.PI/2;
  w.position.set(wx,.4,wz);
  car.group.add(w);car.wheels.push(w);
}

// фары
const lightMat=new THREE.MeshBasicMaterial({color:0xffffcc});
for(const fx of[-.6,.6]){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.35,.25,.1),lightMat);
  l.position.set(fx,.7,2);car.group.add(l);
}

car.group.position.set(0,0,0);
scene.add(car.group);

// ============ СОСТОЯНИЕ МАШИНЫ ============
const state={
  x:0,z:0,angle:0,          // позиция и поворот
  speed:0,                  // скорость м/с
  rpm:900,                  // обороты двигателя
  gear:'N',                 // передача
  clutch:false,
  gas:false,
  brake:false,
  stalled:false,            // заглох
  steering:0,               // угол руля -1..1
  soundOn:true
};

// Передаточные отношения (упрощённые)
const gearRatios={ '1':3.5, '2':2.3, '3':1.6, '4':1.2, '5':0.9, 'R':-3.5, 'N':0 };

// ============ ЗВУК ============
let audioCtx=null;
let engineOsc=null;
let engineGain=null;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    engineOsc=audioCtx.createOscillator();
    engineOsc.type='sawtooth';
    engineOsc.frequency.value=40;
    engineGain=audioCtx.createGain();
    engineGain.gain.value=0;
    // фильтр для мягкости
    const filt=audioCtx.createBiquadFilter();
    filt.type='lowpass';
    filt.frequency.value=800;
    engineOsc.connect(filt);
    filt.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
  }catch(e){}
}
function updateAudio(){
  if(!audioCtx||!engineOsc||!state.soundOn){if(engineGain)engineGain.gain.value=0;return;}
  // частота = обороты / 30
  const freq=Math.max(20,state.rpm/30);
  engineOsc.frequency.setTargetAtTime(freq,audioCtx.currentTime,.05);
  // громкость зависит от газа и оборотов
  let vol=0.04+(state.rpm/7000)*0.08;
  if(state.stalled)vol=0;
  engineGain.gain.setTargetAtTime(vol,audioCtx.currentTime,.05);
}

// ============ УПРАВЛЕНИЕ РУЛЁМ (круговой) ============
const steerCanvas=document.getElementById('steer');
const steerCtx=steerCanvas.getContext('2d');
steerCanvas.width=280;steerCanvas.height=280;
let steerAngle=0;      // текущий угол руля (для отрисовки)
let steerDragging=false;
let steerLastX=0;
let steerLastY=0;

function drawSteer(){
  const W=280,H=280,cx=140,cy=140;
  steerCtx.clearRect(0,0,W,H);
  steerCtx.save();
  steerCtx.translate(cx,cy);
  steerCtx.rotate(steerAngle);
  // обод
  steerCtx.strokeStyle='#222';steerCtx.lineWidth=22;
  steerCtx.beginPath();steerCtx.arc(0,0,100,0,Math.PI*2);steerCtx.stroke();
  steerCtx.strokeStyle='#444';steerCtx.lineWidth=14;
  steerCtx.beginPath();steerCtx.arc(0,0,100,0,Math.PI*2);steerCtx.stroke();
  // спицы
  steerCtx.strokeStyle='#333';steerCtx.lineWidth=10;
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2+Math.PI/2;
    steerCtx.beginPath();steerCtx.moveTo(0,0);
    steerCtx.lineTo(Math.cos(a)*90,Math.sin(a)*90);steerCtx.stroke();
  }
  // центр
  steerCtx.fillStyle='#555';
  steerCtx.beginPath();steerCtx.arc(0,0,18,0,Math.PI*2);steerCtx.fill();
  steerCtx.restore();
  // метка сверху
  steerCtx.fillStyle='#ff3';steerCtx.beginPath();
  steerCtx.arc(cx,cy-100,6,0,Math.PI*2);steerCtx.fill();
}
drawSteer();

steerCanvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  steerDragging=true;
  steerLastX=t.clientX;
  steerLastY=t.clientY;
},{passive:false});
steerCanvas.addEventListener('touchmove',e=>{
  if(!steerDragging)return;
  e.preventDefault();
  const t=e.touches[0];
  const dx=t.clientX-steerLastX;
  steerAngle+=dx*0.02;
  steerAngle=Math.max(-2.5,Math.min(2.5,steerAngle));
  // нормализуем -1..1
  state.steering=steerAngle/2.5;
  steerLastX=t.clientX;
  steerLastY=t.clientY;
  drawSteer();
},{passive:false});
steerCanvas.addEventListener('touchend',e=>{
  steerDragging=false;
},{passive:false});

// ============ ПЕДАЛИ ============
function bindHold(id,key){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();state[key]=true;el.classList.add('active');},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();state[key]=false;el.classList.remove('active');},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();state[key]=true;el.classList.add('active');});
  el.addEventListener('mouseup',e=>{e.preventDefault();state[key]=false;el.classList.remove('active');});
}
bindHold('gasPed','gas');
bindHold('brakePed','brake');
bindHold('clutch','clutch');

// ============ ПЕРЕКЛЮЧАТЕЛЬ ПЕРЕДАЧ ============
const gearBtns=document.querySelectorAll('.gBtn');
let gearTouchStart=null;
gearBtns.forEach(btn=>{
  btn.addEventListener('touchstart',e=>{
    e.preventDefault();
    gearTouchStart={y:e.touches[0].clientY,t:Date.now()};
  },{passive:false});
  btn.addEventListener('touchend',e=>{
    e.preventDefault();
    // переключаемся только если сцепление выжато
    if(!state.clutch){
      showMsg('Нажми СЦЕПЛЕНИЕ для переключения');
      return;
    }
    const g=btn.dataset.g;
    state.gear=g;
    gearBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('gearVal').textContent=g;
    // звук переключения
    if(audioCtx){
      const o=audioCtx.createOscillator();
      const g2=audioCtx.createGain();
      o.frequency.value=200;
      g2.gain.setValueAtTime(.1,audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.1);
      o.connect(g2);g2.connect(audioCtx.destination);
      o.start();o.stop(audioCtx.currentTime+.15);
    }
  },{passive:false});
});

// ============ СООБЩЕНИЯ ============
function showMsg(text){
  const m=document.getElementById('msg');
  m.textContent=text;
  m.classList.add('on');
  clearTimeout(m._t);
  m._t=setTimeout(()=>m.classList.remove('on'),2000);
}

// ============ ЗВУК ВКЛ/ВЫКЛ ============
document.getElementById('soundBtn').addEventListener('click',()=>{
  state.soundOn=!state.soundOn;
  document.getElementById('soundBtn').textContent=state.soundOn?'🔊':'🔇';
  if(state.soundOn)initAudio();
});

// ============ ПРИБОРЫ ============
const speedoCtx=document.getElementById('speedo').getContext('2d');
const tachoCtx=document.getElementById('tacho').getContext('2d');

function drawGauge(ctx,max,value,label,unit,redFrom){
  const W=220,H=220,cx=110,cy=110;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  // фон
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.beginPath();ctx.arc(cx,cy,100,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#555';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,100,0,Math.PI*2);ctx.stroke();
  // красная зона
  if(redFrom!==undefined){
    ctx.strokeStyle='#f33';ctx.lineWidth=8;
    const startAngle=Math.PI*.75+(redFrom/max)*Math.PI*1.5;
    const endAngle=Math.PI*.75+Math.PI*1.5;
    ctx.beginPath();ctx.arc(cx,cy,90,startAngle,endAngle);ctx.stroke();
  }
  // деления и цифры
  ctx.strokeStyle='#aaa';ctx.lineWidth=2;
  ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';
  for(let i=0;i<=10;i++){
    const a=Math.PI*.75+(i/10)*Math.PI*1.5;
    const x1=cx+Math.cos(a)*85,y1=cy+Math.sin(a)*85;
    const x2=cx+Math.cos(a)*95,y2=cy+Math.sin(a)*95;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    const tx=cx+Math.cos(a)*72,ty=cy+Math.sin(a)*72;
    ctx.fillText(Math.round(max*i/10),tx,ty+4);
  }
  // стрелка
  const val=Math.min(value,max);
  const a=Math.PI*.75+(val/max)*Math.PI*1.5;
  ctx.strokeStyle='#ff3333';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(a)*75,cy+Math.sin(a)*75);ctx.stroke();
  // центр
  ctx.fillStyle='#ddd';
  ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();
  // подпись
  ctx.fillStyle='#8af';ctx.font='bold 12px Arial';
  ctx.fillText(label,cx,cy+40);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';
  ctx.fillText(Math.round(value)+' '+unit,cx,cy+58);
  ctx.restore();
}

// ============ ФИЗИКА МКПП ============
function updatePhysics(dt){
  // Определяем, движется ли машина
  const moving=Math.abs(state.speed)>0.5;

  // Работа двигателя
  if(state.stalled){
    state.rpm=Math.max(0,state.rpm-3000*dt);
  }else{
    // обороты холостого хода
    let targetRpm=900;
    if(state.gas&&state.gear!=='N'){
      // обороты зависят от скорости и передачи
      const ratio=Math.abs(gearRatios[state.gear]);
      const wheelRpm=Math.abs(state.speed)*60/(2*Math.PI*0.4);  // об/мин колёс
      targetRpm=Math.max(1000,wheelRpm*ratio*3);
      if(state.clutch){
        // при выжатом сцеплении двигатель крутится свободно от газа
        targetRpm=1500+state.speed*0+3000;
      }
    }else if(state.gas){
      // газ на нейтрали — раскрутка
      targetRpm=900+(state.rpm-900)+2000*dt*10;
      targetRpm=Math.min(7000,targetRpm);
    }else if(state.gear!=='N'&&!state.clutch){
      // без газа с передачей — обороты от скорости
      const ratio=Math.abs(gearRatios[state.gear]);
      const wheelRpm=Math.abs(state.speed)*60/(2*Math.PI*0.4);
      targetRpm=Math.max(700,wheelRpm*ratio*3);
      if(targetRpm<600){
        // глохнет
        state.stalled=true;
        state.rpm=0;
        showMsg('ЗАГЛОХ! Нажми СЦЕП и N, потом заведи');
      }
    }
    // плавное изменение
    state.rpm+=(targetRpm-state.rpm)*Math.min(1,dt*4);
    state.rpm=Math.max(0,Math.min(7500,state.rpm));
    // красная зона
    if(state.rpm>6500&&state.gas){
      state.rpm-=100;
    }
  }

  // Тяга от двигателя
  let force=0;
  if(!state.stalled&&state.gear!=='N'&&!state.clutch){
    const ratio=gearRatios[state.gear];
    const rpmPower=(state.rpm-900)/6000;  // 0..1
    force=ratio*rpmPower*8;
  }

  // Газ на нейтрали — не даёт тяги, только крутит
  // Тормоз
  if(state.brake){
    state.speed-=Math.sign(state.speed)*Math.min(Math.abs(state.speed),15*dt);
  }
  // Трение и сопротивление
  state.speed-=state.speed*0.4*dt;
  // Тяга
  state.speed+=force*dt;
  // Ограничение скорости
  state.speed=Math.max(-30,Math.min(60,state.speed));
  // Нейтраль — медленное замедление
  if(state.gear==='N'&&!state.gas)state.speed*=0.98;

  // Поворот — только если едем
  const speedFactor=Math.min(1,Math.abs(state.speed)/10);
  if(Math.abs(state.speed)>0.1){
    state.angle+=state.steering*speedFactor*state.speed*0.5*dt;
  }

  // Обновляем позицию
  state.x+=Math.sin(state.angle)*state.speed*dt;
  state.z+=Math.cos(state.angle)*state.speed*dt;

  // Обновляем 3D-модель
  car.group.position.set(state.x,0,state.z);
  car.group.rotation.y=state.angle;

  // Колёса крутятся
  const wheelRotation=state.speed*dt/0.4;
  for(const w of car.wheels){
    w.rotation.x-=wheelRotation;
  }
}

// ============ КАМЕРА ОТ САЛОНА ============
function updateCamera(){
  // позиция камеры — в салоне машины, чуть сзади водителя
  const camLocalX=0.35;
  const camLocalY=1.3;
  const camLocalZ=-0.2;
  const cos=Math.cos(state.angle);
  const sin=Math.sin(state.angle);
  // камера внутри машины
  camera.position.x=state.x+camLocalX*cos+camLocalZ*sin;
  camera.position.y=camLocalY;
  camera.position.z=state.z-camLocalX*sin+camLocalZ*cos;
  // смотрим вперёд
  const lookX=state.x+Math.sin(state.angle)*10;
  const lookZ=state.z+Math.cos(state.angle)*10;
  camera.lookAt(lookX,1.2,lookZ);
}

// ============ ЦИКЛ ============
const clock=new THREE.Clock();
let hudTimer=0;

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);

  updatePhysics(dt);
  updateCamera();
  updateAudio();

  // приборы обновляем 10 раз в сек
  hudTimer+=dt;
  if(hudTimer>0.1){
    hudTimer=0;
    // спидометр в км/ч
    const kmh=Math.abs(state.speed)*3.6;
    drawGauge(speedoCtx,180,kmh,'км/ч','',120);
    drawGauge(tachoCtx,8000,state.rpm,'об/мин','',6000);
    // сообщение о заглох
    document.getElementById('stallMsg').textContent=state.stalled?'ЗАГЛОХ':'';
  }

  renderer.render(scene,camera);
}

// первый тап — включаем звук
document.body.addEventListener('touchstart',()=>{if(state.soundOn)initAudio();},{once:true});
document.body.addEventListener('click',()=>{if(state.soundOn)initAudio();},{once:true});

// старт
loop();

// ресайз
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
