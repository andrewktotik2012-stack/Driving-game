<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Driving — МКПП</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
#app{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}

/* Приборы сверху */
#speedo{position:absolute;top:8px;left:8px;width:100px;height:100px}
#tacho{position:absolute;top:8px;left:118px;width:100px;height:100px}
#gearDisplay{position:absolute;top:8px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:6px;text-align:center}
#gearDisplay .lbl{font-size:9px;color:#aaa}
#gearDisplay .val{font-size:22px;font-weight:bold;color:#4f4}
#stallMsg{position:absolute;top:60px;left:50%;transform:translateX(-50%);color:#f55;font-size:12px;font-weight:bold;background:rgba(0,0,0,.6);padding:3px 10px;border-radius:4px;display:none}
#stallMsg.on{display:block}

/* Кнопки руля слева снизу */
#steerBtns{position:fixed;bottom:20px;left:14px;z-index:11;display:flex;gap:12px;pointer-events:auto}
.steerBtn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:26px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.steerBtn.active{background:rgba(100,180,255,.7);border-color:#6af}

/* Педали справа снизу */
#pedals{position:fixed;bottom:20px;right:14px;z-index:11;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.pedal{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center}
.pedal.active{background:rgba(255,80,80,.6);border-color:#f66}
#clutch{background:rgba(80,80,200,.25)}
#clutch.active{background:rgba(100,100,255,.7)}

/* МКПП вертикально справа */
#gearLever{position:fixed;top:50%;right:8px;transform:translateY(-50%);z-index:11;display:flex;flex-direction:column;gap:4px;pointer-events:auto;padding:8px 6px;background:rgba(0,0,0,.5);border-radius:10px}
.gBtn{width:44px;height:40px;border-radius:6px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.gBtn.active{background:rgba(80,200,80,.7);border-color:#5f5}

/* Звук */
#soundBtn{position:fixed;top:8px;right:8px;z-index:12;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid #fff;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;pointer-events:auto}

/* Верхние значения приборов */
#speedVal{position:absolute;top:82px;left:8px;width:100px;text-align:center;color:#fff;font-size:10px;font-weight:bold;text-shadow:0 0 3px #000}
#rpmVal{position:absolute;top:82px;left:118px;width:100px;text-align:center;color:#fff;font-size:10px;font-weight:bold;text-shadow:0 0 3px #000}

#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.8);padding:14px 22px;border-radius:10px;font-size:14px;z-index:15;display:none;text-align:center;max-width:80%}
#msg.on{display:block}

/* Подсказка запуска */
#startHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.75);padding:16px 20px;border-radius:10px;font-size:13px;z-index:14;text-align:center;line-height:1.6;pointer-events:auto;border:2px solid #4f4}
#startHint.hidden{display:none}
#startHint b{color:#4f4}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <canvas id="speedo" width="200" height="200"></canvas>
  <canvas id="tacho" width="200" height="200"></canvas>
  <div id="gearDisplay">
    <div class="lbl">ПЕРЕДАЧА</div>
    <div class="val" id="gearVal">N</div>
  </div>
  <div id="stallMsg">ЗАГЛОХ</div>
  <div id="speedVal">0 км/ч</div>
  <div id="rpmVal">900 об/мин</div>
</div>

<div id="steerBtns">
  <div class="steerBtn" id="steerL">◄</div>
  <div class="steerBtn" id="steerR">►</div>
</div>

<div id="pedals">
  <div class="pedal" id="gasPed">ГАЗ</div>
  <div class="pedal" id="brakePed">ТОРМОЗ</div>
  <div class="pedal" id="clutch">СЦЕП</div>
</div>

<div id="gearLever">
  <div class="gBtn" data-g="1">1</div>
  <div class="gBtn" data-g="2">2</div>
  <div class="gBtn" data-g="3">3</div>
  <div class="gBtn" data-g="4">4</div>
  <div class="gBtn" data-g="5">5</div>
  <div class="gBtn" data-g="R">R</div>
  <div class="gBtn active" data-g="N">N</div>
</div>

<div id="soundBtn">🔊</div>
<div id="msg"></div>
<div id="startHint">
  <b>Как поехать:</b><br>
  1. Нажми <b>СЦЕП</b> (справа)<br>
  2. Выбери <b>1</b> на рычаге справа<br>
  3. Отпусти СЦЕП<br>
  4. Жми <b>ГАЗ</b><br>
  5. Крути <b>◄ ►</b> для поворота<br>
  <br>
  <i>Нажми сюда, чтобы закрыть</i>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ============ SCENE ============
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,80,300);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(80,150,60);
scene.add(sun);

// земля
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({color:0x3a5a3a}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// дороги
const roadMat=new THREE.MeshLambertMaterial({color:0x1a1a1a});
for(let i=-3;i<=3;i++){
  const h=new THREE.Mesh(new THREE.PlaneGeometry(600,10),roadMat);
  h.rotation.x=-Math.PI/2;h.position.set(0,.01,i*50);scene.add(h);
  const v=new THREE.Mesh(new THREE.PlaneGeometry(10,600),roadMat);
  v.rotation.x=-Math.PI/2;v.position.set(i*50,.01,0);scene.add(v);
}
// разметка
const lineMat=new THREE.MeshBasicMaterial({color:0xffff00});
for(let i=-3;i<=3;i++){
  for(let j=-300;j<=300;j+=8){
    const hl=new THREE.Mesh(new THREE.PlaneGeometry(4,.4),lineMat);
    hl.rotation.x=-Math.PI/2;hl.position.set(j,.02,i*50);scene.add(hl);
  }
}
for(let i=-3;i<=3;i++){
  for(let j=-300;j<=300;j+=8){
    const vl=new THREE.Mesh(new THREE.PlaneGeometry(.4,4),lineMat);
    vl.rotation.x=-Math.PI/2;vl.position.set(i*50,.02,j);scene.add(vl);
  }
}

// здания
const bColors=[0x8899aa,0xaa9988,0x99aabb,0xbbaa99,0xa0a0a0];
function mkBuilding(x,z,w,d,f){
  const g=new THREE.Group();g.position.set(x,0,z);
  const col=bColors[Math.floor(Math.random()*5)];
  const mat=new THREE.MeshLambertMaterial({color:col});
  const h=f*4;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  b.position.y=h/2;g.add(b);
  const windowMat=new THREE.MeshBasicMaterial({color:0xffdd88});
  for(let i=0;i<f;i++){
    for(let k=0;k<3;k++){
      if(Math.random()>0.6)continue;
      const ww=new THREE.Mesh(new THREE.PlaneGeometry(1,1),windowMat);
      ww.position.set((k-1)*w/3.5,i*4+2.5,d/2+.01);
      g.add(ww);
    }
  }
  scene.add(g);
}
for(let gx=-3;gx<=3;gx++)for(let gz=-3;gz<=3;gz++){
  if(!gx&&!gz)continue;
  const cx=gx*50,cz=gz*50;
  for(let i=0;i<3;i++){
    const bx=cx+(Math.random()-.5)*30;
    const bz=cz+(Math.random()-.5)*30;
    if(Math.abs(bx-cx)<15&&Math.abs(bz-cz)<15)continue;
    mkBuilding(bx,bz,8+Math.random()*4,8+Math.random()*4,3+Math.floor(Math.random()*7));
  }
}

// фонари
const poleMat=new THREE.MeshLambertMaterial({color:0x333333});
const poleGeo=new THREE.CylinderGeometry(.2,.2,8,6);
const lampMat=new THREE.MeshBasicMaterial({color:0xffdd55});
const headGeo=new THREE.SphereGeometry(.5,6,6);
for(let i=-3;i<=3;i++){
  for(let j=-300;j<=300;j+=30){
    const p=new THREE.Mesh(poleGeo,poleMat);
    p.position.set(i*50+7,4,j);scene.add(p);
    const h=new THREE.Mesh(headGeo,lampMat);
    h.position.set(i*50+7,8.3,j);scene.add(h);
  }
}

// ============ МАШИНА ============
const car={};
car.group=new THREE.Group();
const carBody=new THREE.Mesh(new THREE.BoxGeometry(1.8,.7,4),new THREE.MeshLambertMaterial({color:0xcc3333}));
carBody.position.y=.6;car.group.add(carBody);
const hood=new THREE.Mesh(new THREE.BoxGeometry(1.8,.4,1),new THREE.MeshLambertMaterial({color:0xaa2222}));
hood.position.set(0,.9,1.5);car.group.add(hood);
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.6,.6,2),new THREE.MeshLambertMaterial({color:0xdd4444}));
roof.position.set(0,1.4,-.3);car.group.add(roof);
const glassMat=new THREE.MeshLambertMaterial({color:0x223344,transparent:true,opacity:.7});
const wind=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,.1),glassMat);
wind.position.set(0,1.4,.7);car.group.add(wind);
const rear=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,.1),glassMat);
rear.position.set(0,1.4,-1.3);car.group.add(rear);
const wheelGeo=new THREE.CylinderGeometry(.4,.4,.25,12);
const wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
car.wheels=[];
for(const wx of[-.95,.95])for(const wz of[1.3,-1.3]){
  const w=new THREE.Mesh(wheelGeo,wheelMat);
  w.rotation.z=Math.PI/2;
  w.position.set(wx,.4,wz);
  car.group.add(w);car.wheels.push(w);
}
const lightMat=new THREE.MeshBasicMaterial({color:0xffffcc});
for(const fx of[-.6,.6]){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.35,.25,.1),lightMat);
  l.position.set(fx,.7,2);car.group.add(l);
}
car.group.position.set(0,0,0);
scene.add(car.group);

// ============ СОСТОЯНИЕ ============
const state={
  x:0,z:0,angle:0,
  speed:0,
  rpm:900,
  gear:'N',
  clutch:false,
  gas:false,
  brake:false,
  stalled:false,
  steering:0,       // -1..1, плавно меняется
  steerInput:0,     // -1, 0, 1 — что нажато
  soundOn:true
};

const gearRatios={ '1':3.5, '2':2.3, '3':1.6, '4':1.2, '5':0.9, 'R':-3.5, 'N':0 };

// ============ ЗВУК ============
let audioCtx=null,engineOsc=null,engineGain=null;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    engineOsc=audioCtx.createOscillator();
    engineOsc.type='sawtooth';
    engineOsc.frequency.value=40;
    engineGain=audioCtx.createGain();
    engineGain.gain.value=0;
    const filt=audioCtx.createBiquadFilter();
    filt.type='lowpass';
    filt.frequency.value=800;
    engineOsc.connect(filt);filt.connect(engineGain);engineGain.connect(audioCtx.destination);
    engineOsc.start();
  }catch(e){}
}
function updateAudio(){
  if(!audioCtx||!engineOsc||!state.soundOn){if(engineGain)engineGain.gain.value=0;return;}
  const freq=Math.max(20,state.rpm/30);
  engineOsc.frequency.setTargetAtTime(freq,audioCtx.currentTime,.05);
  let vol=0.04+(state.rpm/7000)*0.08;
  if(state.stalled)vol=0;
  engineGain.gain.setTargetAtTime(vol,audioCtx.currentTime,.05);
}

// ============ УПРАВЛЕНИЕ ============
// Кнопки руля
function bindSteer(id,val){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();state.steerInput=val;el.classList.add('active');},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();state.steerInput=0;el.classList.remove('active');},{passive:false});
  el.addEventListener('touchcancel',e=>{state.steerInput=0;el.classList.remove('active');});
  el.addEventListener('mousedown',e=>{state.steerInput=val;el.classList.add('active');});
  el.addEventListener('mouseup',e=>{state.steerInput=0;el.classList.remove('active');});
}
bindSteer('steerL',-1);
bindSteer('steerR',1);

// Педали
function bindPedal(id,key){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();state[key]=true;el.classList.add('active');},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();state[key]=false;el.classList.remove('active');},{passive:false});
  el.addEventListener('touchcancel',e=>{state[key]=false;el.classList.remove('active');});
  el.addEventListener('mousedown',e=>{state[key]=true;el.classList.add('active');});
  el.addEventListener('mouseup',e=>{state[key]=false;el.classList.remove('active');});
}
bindPedal('gasPed','gas');
bindPedal('brakePed','brake');
bindPedal('clutch','clutch');

// Передачи
const gearBtns=document.querySelectorAll('.gBtn');
gearBtns.forEach(btn=>{
  btn.addEventListener('click',e=>{
    if(!state.clutch){showMsg('Выжми СЦЕП чтобы переключить');return;}
    const g=btn.dataset.g;
    state.gear=g;
    gearBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('gearVal').textContent=g;
  });
});

function showMsg(text){
  const m=document.getElementById('msg');
  m.textContent=text;m.classList.add('on');
  clearTimeout(m._t);
  m._t=setTimeout(()=>m.classList.remove('on'),2000);
}

document.getElementById('soundBtn').addEventListener('click',()=>{
  state.soundOn=!state.soundOn;
  document.getElementById('soundBtn').textContent=state.soundOn?'🔊':'🔇';
  if(state.soundOn)initAudio();
});

// Спрятать подсказку при клике
document.getElementById('startHint').addEventListener('click',function(){
  this.classList.add('hidden');
});

// ============ ПРИБОРЫ ============
const speedoCtx=document.getElementById('speedo').getContext('2d');
const tachoCtx=document.getElementById('tacho').getContext('2d');

function drawGauge(ctx,max,value,label,unit,redFrom){
  const W=200,H=200,cx=100,cy=100;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.beginPath();ctx.arc(cx,cy,90,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#555';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,90,0,Math.PI*2);ctx.stroke();
  if(redFrom!==undefined){
    ctx.strokeStyle='#f33';ctx.lineWidth=6;
    const sA=Math.PI*.75+(redFrom/max)*Math.PI*1.5;
    const eA=Math.PI*.75+Math.PI*1.5;
    ctx.beginPath();ctx.arc(cx,cy,82,sA,eA);ctx.stroke();
  }
  ctx.strokeStyle='#aaa';ctx.lineWidth=1.5;
  ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';
  for(let i=0;i<=10;i++){
    const a=Math.PI*.75+(i/10)*Math.PI*1.5;
    const x1=cx+Math.cos(a)*78,y1=cy+Math.sin(a)*78;
    const x2=cx+Math.cos(a)*86,y2=cy+Math.sin(a)*86;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    const tx=cx+Math.cos(a)*66,ty=cy+Math.sin(a)*66;
    ctx.fillText(Math.round(max*i/10),tx,ty+3);
  }
  const val=Math.min(value,max);
  const a=Math.PI*.75+(val/max)*Math.PI*1.5;
  ctx.strokeStyle='#ff3333';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(a)*68,cy+Math.sin(a)*68);ctx.stroke();
  ctx.fillStyle='#ddd';
  ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8af';ctx.font='bold 10px Arial';
  ctx.fillText(label,cx,cy+30);
}
function drawSpeedo(){
  drawGauge(speedoCtx,180,Math.abs(state.speed)*3.6,'км/ч','',120);
}
function drawTacho(){
  drawGauge(tachoCtx,8000,state.rpm,'об/мин','',6000);
}

// ============ ФИЗИКА ============
function updatePhysics(dt){
  // Руль — плавно приближается к вводу
  const target=state.steerInput;
  state.steering+=(target-state.steering)*Math.min(1,dt*8);
  // Автовозврат если ничего не нажато и едем быстро — чуть сглаживаем
  if(Math.abs(state.speed)<0.5)state.steering*=0.95;

  // РАБОТА ДВИГАТЕЛЯ
  if(state.stalled){
    state.rpm=Math.max(0,state.rpm-3000*dt);
    // Если игрок отпустил всё и нажал N — попытка завести
    if(state.gear==='N'&&state.clutch&&state.gas&&state.rpm<100){
      state.stalled=false;state.rpm=900;
    }
  }else{
    let targetRpm=900;
    if(state.gas){
      if(state.gear==='N'||state.clutch){
        // Газ на нейтрали или с выжатым сцеплением — свободная раскрутка
        targetRpm=Math.min(7000,900+(state.rpm-900)+3000*dt*15+state.rpm*0.15);
      }else{
        // С передачей — обороты от скорости
        const ratio=Math.abs(gearRatios[state.gear]);
        const wheelRpm=Math.abs(state.speed)*60/(2*Math.PI*0.4);
        targetRpm=Math.max(1500,wheelRpm*ratio*3);
      }
    }else{
      if(state.gear!=='N'&&!state.clutch){
        const ratio=Math.abs(gearRatios[state.gear]);
        const wheelRpm=Math.abs(state.speed)*60/(2*Math.PI*0.4);
        targetRpm=Math.max(700,wheelRpm*ratio*3);
        if(targetRpm<600&&Math.abs(state.speed)<1){
          state.stalled=true;state.rpm=0;
          document.getElementById('stallMsg').classList.add('on');
          showMsg('ЗАГЛОХ!\nСЦЕП + N + ГАЗ чтобы завести');
        }
      }
    }
    state.rpm+=(targetRpm-state.rpm)*Math.min(1,dt*4);
    state.rpm=Math.max(0,Math.min(7500,state.rpm));
  }

  // Тяга
  let force=0;
  if(!state.stalled&&state.gear!=='N'&&!state.clutch){
    const ratio=gearRatios[state.gear];
    const rpmPower=Math.max(0,(state.rpm-900)/5000);
    force=ratio*rpmPower*6;
  }
  // Тормоз
  if(state.brake){
    state.speed-=Math.sign(state.speed)*Math.min(Math.abs(state.speed),20*dt);
  }
  // Трение
  state.speed-=state.speed*0.3*dt;
  // Тяга
  state.speed+=force*dt;
  // Лимит
  state.speed=Math.max(-30,Math.min(70,state.speed));
  // Очень маленькая скорость — обнуляем (не дёргается)
  if(Math.abs(state.speed)<0.05)state.speed=0;

  // ПОВОРОТ — только если едем
  if(Math.abs(state.speed)>0.5){
    // Скорость поворота зависит от скорости, но НЕ линейно-бесконечно
    // Делим на (1 + speed*0.05), чтобы на большой скорости руль был слабее
    const speedFactor=Math.min(1.5,Math.abs(state.speed)/8);
    const turnRate=state.steering*speedFactor*1.2*dt;
    state.angle+=turnRate*Math.sign(state.speed);
  }

  // Движение
  state.x+=Math.sin(state.angle)*state.speed*dt;
  state.z+=Math.cos(state.angle)*state.speed*dt;

  // Обновление модели
  car.group.position.set(state.x,0,state.z);
  car.group.rotation.y=state.angle;
  // Колёса крутятся
  const wheelRotation=state.speed*dt/0.4;
  for(const w of car.wheels)w.rotation.x-=wheelRotation;
}

// ============ КАМЕРА ============
function updateCamera(){
  // Камера сзади-сверху
  const camDist=9;
  const camHeight=4;
  const camX=state.x-Math.sin(state.angle)*camDist;
  const camZ=state.z-Math.cos(state.angle)*camDist;
  camera.position.set(camX,camHeight,camZ);
  camera.lookAt(state.x,1,state.z);
}

// ============ ЦИКЛ ============
const clock=new THREE.Clock();
let hudTimer=0;

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  updatePhysics(dt);
  updateCamera();
  updateAudio();
  hudTimer+=dt;
  if(hudTimer>0.1){
    hudTimer=0;
    drawSpeedo();drawTacho();
    document.getElementById('speedVal').textContent=Math.round(Math.abs(state.speed)*3.6)+' км/ч';
    document.getElementById('rpmVal').textContent=Math.round(state.rpm)+' об/мин';
    if(!state.stalled)document.getElementById('stallMsg').classList.remove('on');
  }
  renderer.render(scene,camera);
}

document.body.addEventListener('touchstart',()=>{if(state.soundOn)initAudio();},{once:true});
document.body.addEventListener('click',()=>{if(state.soundOn)initAudio();},{once:true});

loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
